# Profile de servidor (SPRING_PROFILES_ACTIVE=prod). Só sobrescreve o que muda em relação
# ao application.properties — todo o resto (context-path, porta, locales, menu) vale igual.
# Ver docs/SERVIDOR-TESTE.md.

# Banco vem do ambiente (docker-compose / .env do servidor), nunca do git.
main.datasource.url=${DB_URL}
main.datasource.username=${DB_USUARIO}
main.datasource.password=${DB_SENHA}

# Tela de login sem usuário/senha pré-preenchidos (LoginView ignora valor em branco).
ui.login.defaultUsername=
ui.login.defaultPassword=

# Log de servidor: sem códigos de cor ANSI e sem o debug de controle de acesso.
spring.output.ansi.enabled=never
logging.level.io.jmix.core.AccessLogger=info
