name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gate 1 — fast syntax/API check. Blind to *-view.xml defects; Gate 2 covers those.
      - name: Compile (Gate 1)
        run: ./gradlew --no-daemon compileJava

      # Gate 2 — boots the Spring/Jmix context + Liquibase against file-backed HSQLDB, then exits.
      - name: Test (Gate 2)
        run: ./gradlew --no-daemon clean test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
